# Long-run validation batch, manual only.
#
# The nightly soak samples four seeds and costs minutes; this workflow is for the
# multi-hour batches the exit criteria in docs/validation.md are written against.
# It shards the model checker across runners, sums what each shard reported, and
# (optionally) appends one row to verification/soak-history.md - only that file,
# and only when the batch is meant to be recorded.
#
# Size it from the ledger: ops_target / (ops_per_second * shards * minutes * 60)
# gives the minutes per shard. The defaults are a calibration batch, not a
# certification run.
#
# TSan: `tsan=true` builds with -fsanitize=thread and runs one mutex per thread
# (phase 1's single-threaded multi-mutex nesting is a lock-order false positive
# under TSan; see docs/validation.md). TSan is Unix-only.

name: soak batch

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards (1-8)"
        default: "4"
      minutes:
        description: "Wall-clock minutes per shard (<= 300; the job limit is 6 h)"
        default: "120"
      seeds_per_shard:
        description: "Seeds per shard; each gets minutes*60/seeds_per_shard seconds"
        default: "8"
      threads:
        description: "Threads per shard (8 oversubscribes a 4-vCPU runner, which adds preemption)"
        default: "8"
      seed_base:
        description: "First seed; shard s starts at seed_base + s*seeds_per_shard"
        default: "1000"
      runs_on:
        description: "Runner label: ubuntu-latest, windows-latest, ubuntu-24.04-arm"
        default: "ubuntu-latest"
      label:
        description: "Platform label written to the history row"
        default: "linux"
      tsan:
        description: "Build with ThreadSanitizer (Unix only; runs --mutexes 1)"
        type: boolean
        default: false
      record:
        description: "Append the batch to verification/soak-history.md and commit it"
        type: boolean
        default: true

permissions:
  contents: write

# One group per run: several batches may be in flight, and the record step
# fast-forwards and retries if two of them reach the history at the same time.
concurrency:
  group: soak-batch-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        env:
          SHARDS: ${{ inputs.shards }}
          RUNS_ON: ${{ inputs.runs_on }}
          TSAN: ${{ inputs.tsan }}
        run: |
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 8 ]; then
            echo "shards must be between 1 and 8"
            exit 2
          fi
          case "$RUNS_ON" in
            windows*) [ "$TSAN" = "true" ] && { echo "TSan is Unix-only"; exit 2; } ;;
          esac
          python3 -c 'import json, os; print("shards=" + json.dumps(list(range(int(os.environ["SHARDS"])))))' >> "$GITHUB_OUTPUT"

  shard:
    name: shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          TSAN: ${{ inputs.tsan }}
        run: |
          if [ "$TSAN" = "true" ]; then
            g++ -O1 -g -std=c++17 -pthread -fsanitize=thread -Iinclude tests/model_check.cpp -o model_check
          else
            g++ -O2 -std=c++17 -pthread -Iinclude tests/model_check.cpp -o model_check
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cl /O2 /std:c++17 /EHsc /Iinclude tests/model_check.cpp /Fe:model_check.exe

      - name: Run the shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          MINUTES: ${{ inputs.minutes }}
          SEEDS: ${{ inputs.seeds_per_shard }}
          THREADS: ${{ inputs.threads }}
          SEED_BASE: ${{ inputs.seed_base }}
          TSAN: ${{ inputs.tsan }}
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: |
          set -o pipefail
          if [ "$MINUTES" -lt 1 ] || [ "$SEEDS" -lt 1 ] || [ "$THREADS" -lt 1 ]; then
            echo "bad inputs: minutes=$MINUTES seeds=$SEEDS threads=$THREADS"
            exit 2
          fi
          per=$(( MINUTES * 60 / SEEDS ))
          if [ "$per" -lt 60 ]; then
            echo "per-seed duration would be ${per}s; raise minutes or lower seeds_per_shard"
            exit 2
          fi
          mutexes=8
          bin=./model_check
          if [ "$TSAN" = "true" ]; then
            mutexes=1
          fi
          case "$RUNNER_OS" in
            Windows) bin=./model_check.exe ;;
          esac
          first=$(( SEED_BASE + SHARD * SEEDS ))
          echo "shard=$SHARD per_seed=${per}s first_seed=$first mutexes=$mutexes" | tee out.txt
          for i in $(seq 0 $(( SEEDS - 1 ))); do
            seed=$(( first + i ))
            echo "=== seed $seed ===" | tee -a out.txt
            "$bin" --seed "$seed" --ops 2000000 --threads "$THREADS" --mutexes "$mutexes" --seconds "$per" 2>&1 | tee -a out.txt
          done

      - name: Upload the shard log
        # Also on failure: the failing seed and its ring dump are the evidence,
        # and a failed run step would otherwise skip this.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out.txt
          retention-days: 90

  report:
    name: report
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the shard logs
        uses: actions/download-artifact@v4
        with:
          path: shards

      - name: Aggregate the batch
        env:
          SHARDS: ${{ inputs.shards }}
          MINUTES: ${{ inputs.minutes }}
          SEEDS: ${{ inputs.seeds_per_shard }}
          THREADS: ${{ inputs.threads }}
          SEED_BASE: ${{ inputs.seed_base }}
          LABEL: ${{ inputs.label }}
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          python3 - <<'PY'
          import glob, os, re

          shards = int(os.environ["SHARDS"])
          seeds = int(os.environ["SEEDS"])
          first = int(os.environ["SEED_BASE"])
          last = first + shards * seeds - 1
          threads = os.environ["THREADS"]
          minutes = os.environ["MINUTES"]
          label = os.environ["LABEL"]

          total_ops = total_entries = 0
          runs = 0
          problems = []
          for path in sorted(glob.glob("shards/shard-*/out.txt")):
              text = open(path, encoding="utf-8", errors="replace").read()
              for m in re.finditer(
                  r"phase 2: (\d+) threads x (\d+)s, ops=(\d+) entries=(\d+) exits=(\d+) inside=(\d+) "
                  r"overlaps=(\d+) readerWithWriter=(\d+) stranded=(\w+)", text):
                  t, secs, ops, entries, exits, inside, overlaps, rww, stranded = m.groups()
                  runs += 1
                  total_ops += int(ops)
                  total_entries += int(entries)
                  if int(overlaps) or int(rww) or stranded != "no" or int(inside) != 0 or exits != entries:
                      problems.append(f"{path}: overlaps={overlaps} rww={rww} stranded={stranded} inside={inside}")
              if "VERDICT: model holds" not in text:
                  problems.append(f"{path}: no verdict")
          if len(glob.glob("shards/shard-*/out.txt")) != shards:
              problems.append(f"expected {shards} shard logs, found {len(glob.glob('shards/shard-*/out.txt'))}")
          if runs != shards * seeds:
              problems.append(f"expected {shards * seeds} runs, found {runs}")
          if os.environ["SHARD_RESULT"] != "success":
              problems.append(f"shard job result: {os.environ['SHARD_RESULT']}")

          verdict = "green" if not problems else "red"
          print(f"shards={shards} minutes={minutes} threads={threads} label={label} seeds={first}-{last}")
          print(f"runs={runs} ops={total_ops} entries={total_entries} verdict={verdict}")
          for p in problems:
              print("  " + p)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## soak batch {os.environ['GITHUB_RUN_ID']} ({label})\n\n")
              f.write(f"- shards: {shards}, minutes/shard: {minutes}, threads: {threads}, seeds/shard: {seeds}\n")
              f.write(f"- seeds: {first}-{last}\n")
              f.write(f"- ops: {total_ops}, exclusive entries: {total_entries}\n")
              f.write(f"- verdict: **{verdict}**\n")
              for p in problems:
                  f.write(f"- {p}\n")

          with open("verdict.txt", "w", encoding="utf-8") as f:
              f.write(f"{verdict}\n{first}\n{last}\n{total_ops}\n{total_entries}\n")
          PY

      - name: Record the batch in the soak history
        if: ${{ inputs.record }}
        env:
          SHARDS: ${{ inputs.shards }}
          MINUTES: ${{ inputs.minutes }}
          THREADS: ${{ inputs.threads }}
          LABEL: ${{ inputs.label }}
        run: |
          # actions/checkout uses the dispatch SHA, not the current main, so a
          # batch that runs for hours would push a commit based on a stale tip.
          git pull --ff-only origin main
          python3 - <<'PY'
          import datetime, os, pathlib

          verdict, first, last, ops, entries = pathlib.Path("verdict.txt").read_text(encoding="utf-8").split()
          shards = os.environ["SHARDS"]
          minutes = os.environ["MINUTES"]
          threads = os.environ["THREADS"]
          label = os.environ["LABEL"]
          row = (
              f"| {datetime.date.today().isoformat()} | {os.environ['GITHUB_RUN_ID']} | {label} | "
              f"{shards} | {minutes} | {threads} | {first}-{last} | {ops} | {entries} | {verdict} |\n"
          )
          path = pathlib.Path("verification/soak-history.md")
          with path.open("a", encoding="utf-8", newline="\n") as f:
              f.write(row)
          print(row.strip())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/soak-history.md
          changed=$(git diff --cached --name-only)
          if [ "$changed" != "verification/soak-history.md" ]; then
            echo "refusing to commit unexpected paths: $changed"
            exit 1
          fi
          git commit -m "chore(soak): record batch ${GITHUB_RUN_ID}"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi

      - name: Fail the run on a red verdict
        if: ${{ always() }}
        run: |
          verdict=$(head -n 1 verdict.txt 2>/dev/null || echo red)
          echo "batch verdict: $verdict"
          if [ "$verdict" != "green" ]; then
            exit 1
          fi
