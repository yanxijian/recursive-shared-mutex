# Nightly soak: the push-time suite finishes in about three seconds, which is not
# much of a soak for a concurrency primitive. These two jobs run the
# framework-free mutual-exclusion driver for a minute - once plain, once under
# TSan - so a race or a stranded slot that needs a lucky interleaving has a
# chance to show up.
#
# Deliberately separate from ci.yml: nobody should wait for this on a push, and
# its failures are almost always real, so they deserve their own page instead of
# a red cell in a matrix everyone has learned to skim.

name: soak

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off-peak UTC
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: true

jobs:
  mutual-exclusion:
    name: mutual_exclusion 60s
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: g++ -O2 -std=c++17 -pthread -Iinclude tests/mutual_exclusion.cpp -o mutual_exclusion

      - name: Run (8 threads, 60 s)
        run: ./mutual_exclusion --threads 8 --seconds 60

  mutual-exclusion-tsan:
    name: mutual_exclusion 30s, TSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: g++ -O1 -g -std=c++17 -pthread -fsanitize=thread -Iinclude tests/mutual_exclusion.cpp -o mutual_exclusion

      - name: Run (4 threads, 30 s)
        run: ./mutual_exclusion --threads 4 --seconds 30

  model-check:
    # The fixed suite checks the cases someone thought of. This one walks random
    # operation sequences against a shadow model; each seed is a different
    # interleaving family, so a nightly sweep samples the schedule space instead
    # of replaying the same one for an hour.
    name: model_check, 4 seeds x 30s
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: g++ -O2 -std=c++17 -pthread -Iinclude tests/model_check.cpp -o model_check

      - name: Run (8 threads, seeds 1-4, 30 s each)
        run: |
          for seed in 1 2 3 4; do
            echo "--- seed $seed ---"
            ./model_check --seed "$seed" --ops 2000000 --threads 8 --seconds 30
          done

  model-check-tsan:
    name: model_check 30s, TSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: g++ -O1 -g -std=c++17 -pthread -fsanitize=thread -Iinclude tests/model_check.cpp -o model_check

      # One mutex on purpose: phase 1 holds several mutexes at once by design
      # (single-threaded, so it cannot deadlock), and TSan reports that as a
      # lock-order inversion on the same thread. Data-race detection does not
      # need the multi-mutex layout; the plain job above keeps 8.
      - name: Run (4 threads, 1 mutex, seed 7, 30 s)
        run: ./model_check --seed 7 --ops 500000 --threads 4 --mutexes 1 --seconds 30
