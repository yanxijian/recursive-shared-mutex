name: CI

on:
  push:
    branches: [main, master]
    # Positive filters: a build starts only when something it builds changed. A
    # documentation or script change cannot break the build, so it does not start
    # three operating systems. Keep the rules checks out of here - they belong to
    # hygiene.yml, which has to run on documentation changes.
    paths: &build_inputs
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/*.cpp"
      - "benchmarks/CMakeLists.txt"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".clang-format"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths: *build_inputs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRSM_BUILD_TESTS=ON
          -DRSM_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120
