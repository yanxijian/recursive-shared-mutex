# The consumer-shaped build: the default CMake generator and the default compiler
# of each OS, nothing pinned. platform-matrix.yml covers the same three OS with
# pinned toolchains and Ninja; both running on `main` is deliberate, not a
# duplicate - see "CI is tiered" in AGENTS.md before removing either.
name: CI

on:
  push:
    branches: [main, master]
    # Positive filters: a build starts only when something it builds changed. A
    # documentation or script change cannot break the build, so it does not start
    # three operating systems. Keep the rules checks out of here - they belong to
    # hygiene.yml, which has to run on documentation changes.
    paths: &build_inputs
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "benchmarks/*.cpp"
      - "benchmarks/CMakeLists.txt"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".clang-format"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths: *build_inputs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DRSM_BUILD_TESTS=ON
          -DRSM_BUILD_EXAMPLES=ON
          -DRSM_BUILD_STRESS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

  install-package:
    # The one path the rest of this workflow never takes: install into a prefix
    # and consume the package from it. R5 exists because the version pair broke
    # find_package() once; nothing has exercised it since.
    name: install + find_package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install into a prefix
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix "$RUNNER_TEMP/prefix"

      - name: Consume it as a downstream project
        run: |
          cmake -S tests/consumer -B build-consumer \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build build-consumer
          ./build-consumer/rsm_consumer
