# Benchmark automation: run the perf scenarios in CI, refresh the checked-in
# numbers, and gate PRs on a regression.
#
# Design notes
#  * Correctness is covered by ci.yml and platform-matrix.yml; this workflow is
#    only about throughput.
#  * Numbers from GitHub's shared runners drift a few percent between runs and
#    change outright between hardware generations, so:
#      - the image is pinned (windows-2022) to keep runs comparable;
#      - every pair is measured -Repeats times and the median is reported;
#      - the meaningful value is the speedup vs recursive_mutex measured in the
#        same run, not absolute ops/s;
#      - the gate only compares against a baseline CI itself produced. The files
#        committed today were measured on a developer machine, so until this
#        workflow has refreshed them once, the gate warns instead of failing.
#  * "Update" opens a PR rather than pushing to main: a weekly bot commit with
#    +-2% noise is worse than no bot at all.
#  * PRs opened with GITHUB_TOKEN do not trigger other workflows (GitHub
#    limitation), so a benchmark PR arrives without checks. That is fine - it
#    only touches benchmarks/results/ci-*.md.
#
# HARD RULE - this workflow never merges a pull request. Not one, not even the
# ones it opens itself, and certainly not a human's. The only automatic merge is
# `POST /repos/{repo}/merges` for a `bench/refresh-<toolchain>` branch that this
# same job created seconds earlier, and only after every changed path matched
# `benchmarks/results/ci-*.md`. Human PRs are only ever *checked* (the gate job),
# never merged. Keep it that way: do not add `gh pr merge` here.

name: benchmarks

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:
    inputs:
      toolchain:
        description: Which toolchain(s) to measure
        type: choice
        options: [both, msvc, mingw]
        default: both
      repeats:
        description: Runs per (scenario, impl) pair; the median is reported
        type: string
        default: "3"
      seconds:
        description: Duration of one run, in seconds
        type: string
        default: "3"
      update_mode:
        description: What to do with the refreshed results
        type: choice
        options: [auto-merge, pull-request, commit, none]
        default: auto-merge
      regression_pct:
        description: Fail when a speedup drops by more than this percentage (0 = do not gate)
        type: string
        default: "0"
  pull_request:
    paths:
      - "include/**"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ---------------------------------------------------------------------------
  # Scheduled / manual: measure, refresh benchmarks/results/*.md, open a PR.
  # ---------------------------------------------------------------------------
  refresh:
    name: refresh / ${{ matrix.name }}
    # `matrix` is not available in a job-level if (it is evaluated before the
    # matrix expands), so the toolchain filter lives on the steps below.
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc, toolchain: msvc }
          - { name: mingw, toolchain: mingw }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # create-pull-request wants history to diff against

      - name: Set up MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up MinGW
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: Measure
        if: inputs.toolchain == 'both' || inputs.toolchain == matrix.toolchain
        shell: pwsh
        run: |
          if ("${{ matrix.toolchain }}" -eq "mingw") {
            $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          }
          pwsh -NoProfile -File benchmarks/run_bench.ps1 -Toolchain ${{ matrix.toolchain }} `
            -Seconds ${{ inputs.seconds || '3' }} -Repeats ${{ inputs.repeats || '3' }} `
            -RegressionPct ${{ inputs.regression_pct || '0' }}

      - name: Show what changed
        if: inputs.toolchain == 'both' || inputs.toolchain == matrix.toolchain
        shell: pwsh
        run: git --no-pager diff --stat -- benchmarks/results

      - name: Open a PR with the refreshed numbers
        id: pr
        # Not fatal: creating PRs requires the repository setting
        # "Allow GitHub Actions to create and approve pull requests". The branch is
        # pushed either way, so a maintainer can open it with one click - see the
        # fallback step below.
        continue-on-error: true
        if: (inputs.toolchain == 'both' || inputs.toolchain == matrix.toolchain) && inputs.update_mode == 'pull-request'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bench/refresh-${{ matrix.name }}
          delete-branch: true
          add-paths: benchmarks/results/ci-*.md
          commit-message: "bench: refresh ${{ matrix.name }} results"
          title: "bench: refresh ${{ matrix.name }} results"
          body: |
            Automated refresh of `benchmarks/results/ci-${{ matrix.name == 'msvc' && 'msvc' || 'mingw-gcc' }}.md` - the CI-runner numbers used for run-to-run drift detection.

            - Measured on a `windows-2022` GitHub runner, medians of ${{ inputs.repeats || '3' }} runs.
            - Absolute numbers belong to that runner; compare the speedup column.
            - Opened by `.github/workflows/benchmarks.yml` and **merged automatically**
              when the diff stays inside `benchmarks/results/ci-*.md`. It carries no
              checks: PRs created with `GITHUB_TOKEN` do not start workflows (GitHub
              limitation), and a results-only change does not need the full matrix.

      - name: Merge it, so nobody has to
        # A pull request for a results file invites a click that nobody wants to
        # make, and having one created and squashed within a second trips GitHub's
        # PR-event run ("workflow file issue") and leaves red Xs behind. So in
        # auto-merge mode the commit goes straight onto main through the API. The
        # commit itself is the audit trail, and `git revert` is the undo.
        # Belt and braces: auto-merge is a schedule/dispatch-only path. Even if a
        # pull_request trigger is added later, this can never fire on a PR.
        if: |
          github.event_name != 'pull_request' &&
          (inputs.toolchain == 'both' || inputs.toolchain == matrix.toolchain) &&
          inputs.update_mode == 'auto-merge'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "bench/refresh-${{ matrix.name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results
          if (git diff --cached --quiet) {
            Write-Host "Nothing to commit: the results file is unchanged."
            exit 0
          }
          # Refuse to carry anything other than the CI results files.
          $paths = @(git diff --cached --name-only)
          $unexpected = @($paths | Where-Object { $_ -notmatch '^benchmarks/results/ci-[A-Za-z0-9._-]+[.]md$' })
          if ($unexpected.Count -gt 0) {
            Write-Host ("::warning::not committing: unexpected paths {0}" -f ($unexpected -join ", "))
            exit 0
          }
          git commit -m "bench: refresh ${{ matrix.name }} results"
          # The other matrix cell merges concurrently, so a rejected fast-forward
          # is expected; rebase and retry.
          for ($i = 1; $i -le 4; $i++) {
            git push --force origin "HEAD:$branch" | Write-Host
            gh api -X POST "repos/$env:GITHUB_REPOSITORY/merges" -f base=main -f head=$branch `
              -f commit_message="bench: refresh ${{ matrix.name }} results" | Write-Host
            if ($LASTEXITCODE -eq 0) {
              Write-Host ("Merged {0} into main ({1})." -f $branch, ($paths -join ", "))
              git push origin --delete $branch | Write-Host
              exit 0
            }
            Start-Sleep -Seconds 5
            git fetch origin main | Write-Host
            git rebase origin/main | Write-Host
          }
          throw "could not merge $branch after 4 attempts"

      - name: Report the outcome
        if: (inputs.toolchain == 'both' || inputs.toolchain == matrix.toolchain) && inputs.update_mode == 'pull-request'
        shell: pwsh
        run: |
          $branch = "bench/refresh-${{ matrix.name }}"
          if ("${{ steps.pr.outcome }}" -eq "success") {
            Write-Host ("Pull request for {0}: {1}" -f $branch, "${{ steps.pr.outputs.pull-request-url }}")
          }
          else {
            $url = "${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
            Write-Host "::warning::Could not open the PR. Either enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or run this workflow with update_mode=commit. The branch was pushed: $url"
            Write-Host $url
          }

  # ---------------------------------------------------------------------------
  # PR gate: short run, compare against the committed baseline, fail on a real
  # regression. Warns instead until the baseline came from CI itself.
  # ---------------------------------------------------------------------------
  gate:
    name: gate / no regression
    if: github.event_name == 'pull_request'
    # Read-only on purpose: this job only measures and compares. It cannot merge,
    # push or comment on anything.
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Measure and compare
        shell: pwsh
        run: |
          $baseline = "benchmarks/results/ci-msvc.md"
          $fromCi = Test-Path $baseline
          if ($fromCi) {
            Write-Host "::notice::comparing against the committed CI baseline (25% threshold)"
            pwsh -NoProfile -File benchmarks/run_bench.ps1 -Toolchain msvc -Seconds 2 -Repeats 3 `
              -OutDir "$env:RUNNER_TEMP/bench" -Baseline $baseline -RegressionPct 25
          }
          else {
            Write-Host "::warning::no CI baseline yet (benchmarks/results/ci-msvc.md); running without a gate. Dispatch this workflow once to seed it."
            pwsh -NoProfile -File benchmarks/run_bench.ps1 -Toolchain msvc -Seconds 2 -Repeats 3 `
              -OutDir "$env:RUNNER_TEMP/bench" -RegressionPct 0
          }
          if ($LASTEXITCODE -ne 0) { throw "benchmark gate failed" }
