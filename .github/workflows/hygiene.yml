# Rules that do not need a compiler: encoding/BOM/line endings, the changelog,
# the translated documents, and that every relative link resolves.
#
# This runs on *every* push and pull request, including documentation-only ones,
# which is exactly why it is separate from ci.yml: that workflow filters on
# build inputs and would never see a docs change.

name: hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    name: repo-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository rules
        run: python3 scripts/repo_rules.py check --config repo-rules.json
      - uses: actions/checkout@v4
        with:
          repository: yanxijian/RepoRules
          path: .repo-rules
      - name: Check vendored checker is current
        run: python3 .repo-rules/repo_rules.py sync --root . --hook --check

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format (pinned)
        # Pinned through PyPI, not apt: the distro package moves with the image and
        # silently reflows the tree when it does. Bump this on purpose, together
        # with a reformatting commit.
        run: |
          python3 -m venv "$RUNNER_TEMP/fmt"
          "$RUNNER_TEMP/fmt/bin/pip" install --quiet --disable-pip-version-check clang-format==22.1.8
          echo "$RUNNER_TEMP/fmt/bin" >> "$GITHUB_PATH"

      - name: Report the version
        run: clang-format --version

      - name: Check formatting
        run: >
          clang-format --dry-run -Werror
          include/recursive_shared_mutex/recursive_shared_mutex.hpp
          include/recursive_shared_mutex/instrumented_write_lock.hpp
          tests/test_recursive_shared_mutex.cpp
          tests/test_instrumented_write_lock.cpp
          tests/backend_contract.cpp
          tests/mutual_exclusion.cpp
          tests/stress_concurrent.cpp
          tests/consumer/main.cpp
          examples/basic_usage.cpp
          examples/cross_module_hazard/dll_side.cpp
          examples/cross_module_hazard/exe_side.cpp
          examples/cross_module_hazard/iface.h
          benchmarks/bench_vs_recursive_mutex.cpp